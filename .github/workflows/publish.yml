name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify binary exists
        run: |
          test -f flatten_filelist/_bin/flatten-filelist || {
            echo "ERROR: binary not found. Run: cargo build --release --no-default-features --target x86_64-unknown-linux-musl && cp target/x86_64-unknown-linux-musl/release/flatten-filelist flatten_filelist/_bin/"
            exit 1
          }
          test -x flatten_filelist/_bin/flatten-filelist || chmod +x flatten_filelist/_bin/flatten-filelist

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build --wheel

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
