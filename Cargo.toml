[package]
name = "flatten-filelist"
version = "0.1.0"
edition = "2021"

[lib]
name = "flatten_filelist"
crate-type = ["cdylib", "lib"]

[features]
default = ["python-bindings"]
python-bindings = ["pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3.10"
